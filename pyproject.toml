[project]
name = "tg-bot"
version = "0.1.0"
description = "TG bot for groups"
readme = "README.md"
authors = [
    { name = "Vantied", email = "mrvano555@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.32.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.6",
]

[project.scripts]
tg-bot = "tg_bot.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["E265", "D100", "D105", "D104", "D203", "D211", "D213", "N818", "W505", "ANN401", "COM812", "I001",]
select = ["E5", "E4", "E7", "E9", "W", "C90", "I", "N", "D", "F", "ANN", "ASYNC", "A", "COM", "RET", "UP", "B", "SIM",]

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore in all files.
"__init__.py" = ["E402", "E401"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]


